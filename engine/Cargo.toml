[package]
name = "herdr-session"
version = "0.1.11"
edition = "2021"
description = "Engine for herdr live share: the session ledger, sync, and Claude hooks"
license = "MIT"

[[bin]]
name = "herdr-session"
path = "src/main.rs"

[dependencies]
ed25519-dalek = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.2"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
