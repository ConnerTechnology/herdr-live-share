# Builds herdr-session for each OS and attaches it to the GitHub release for a v* tag.
# install.sh downloads herdr-session-<os>-<arch>.tar.gz from the latest release and
# builds from source only when no asset fits.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: herdr-session-linux-x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: herdr-session-linux-aarch64 }
          - { runner: macos-latest, target: aarch64-apple-darwin, asset: herdr-session-darwin-aarch64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, asset: herdr-session-darwin-x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p herdr-session
      - name: Package
        run: tar -czf ${{ matrix.asset }}.tar.gz -C target/${{ matrix.target }}/release herdr-session
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" herdr-session-*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
